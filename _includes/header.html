<header class="site-header">

  <div class="container header-inner">

    <a
      class="site-brand"
      href="{{ '/' | relative_url }}"
      aria-label="ABC Projects Home">

      <span class="brand-name">
        <span class="brand-abc">ABC</span> Projects
      </span>

      <span class="brand-tagline">
        Research Profile &amp; Evidence Support
      </span>

    </a>


    <button
      class="menu-toggle"
      type="button"
      aria-label="Open navigation menu"
      aria-expanded="false"
      aria-controls="main-navigation">

      <span></span>
      <span></span>
      <span></span>

    </button>


    <nav
      class="main-navigation"
      id="main-navigation"
      aria-label="Main navigation">


      <!-- HOME -->

      <a href="{{ '/' | relative_url }}">
        Home
      </a>


      <!-- SERVICES -->

      <a
        href="{{ '/services/' | relative_url }}"
        {% if page.url contains '/services' %}
        class="is-active"
        aria-current="page"
        {% endif %}>

        Services

      </a>


      <!-- IMMIGRATION SUPPORT -->

      <a
        href="{{ '/immigration-support/' | relative_url }}"
        {% if page.url contains '/immigration-support' %}
        class="is-active"
        aria-current="page"
        {% endif %}>

        EB-1 / NIW / O-1

      </a>


      <!-- PAST PROJECTS -->

      <a
        href="{{ '/past-projects/' | relative_url }}"
        {% if page.url contains '/past-projects' %}
        class="is-active"
        aria-current="page"
        {% endif %}>

        Past Projects

      </a>


      <!-- RESOURCES -->

      <a
        href="{{ '/resources/' | relative_url }}"
        {% if page.url contains '/resources' %}
        class="is-active"
        aria-current="page"
        {% endif %}>

        Resources

      </a>


      <!-- ABOUT -->

      <a
        href="{{ '/about/' | relative_url }}"
        {% if page.url contains '/about' %}
        class="is-active"
        aria-current="page"
        {% endif %}>

        About

      </a>


      <!-- CONTACT -->

      <a
        href="{{ '/contact/' | relative_url }}"
        {% if page.url contains '/contact' %}
        class="is-active"
        aria-current="page"
        {% endif %}>

        Contact

      </a>


      <!-- HEADER CTA -->

      <a
        class="header-cta"
        href="{{ '/contact/' | relative_url }}">

        Book a Free Profile Review

      </a>

    </nav>

  </div>

</header>
